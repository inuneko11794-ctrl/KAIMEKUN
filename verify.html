<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記録検証ラボ | BYN3 × 万車ノート</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #020617; color: #e2e8f0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; line-height: 1.6; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 2px; }
  h2 { font-size: 16px; margin: 26px 0 8px; border-left: 4px solid #22d3ee; padding-left: 8px; }
  .sub { color: #94a3b8; font-size: 12px; }
  .drop { border: 2px dashed #334155; border-radius: 14px; padding: 22px; text-align: center; color: #94a3b8; margin-top: 14px; background: #0f172a; }
  .drop.over { border-color: #22d3ee; color: #e2e8f0; }
  .drop input { display: none; }
  .drop label { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #164e63; color: #ecfeff; font-weight: bold; cursor: pointer; min-height: 40px; }
  .files { margin-top: 10px; font-size: 12px; color: #a5f3fc; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 4px; }
  th, td { border: 1px solid #1e293b; padding: 6px 8px; text-align: right; }
  th { background: #0f172a; color: #94a3b8; font-weight: 600; }
  td:first-child, th:first-child { text-align: left; }
  .scroll { overflow-x: auto; }
  .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
  .big { font-size: 22px; font-weight: 800; }
  .rose { color: #fda4af; } .amber { color: #fcd34d; } .emerald { color: #6ee7b7; } .cyan { color: #67e8f9; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .muted { color: #94a3b8; font-size: 12px; }
  .hidden { display: none; }
  ul.list { margin: 4px 0; padding-left: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔬 記録検証ラボ</h1>
  <div class="sub">BYN3バックアップと万車ノートのJSONを読み込んで、その場で集計します。データはこの端末の外に出ません。</div>

  <div class="drop" id="bynDrop">
    <div><b>① BYN3バックアップ</b>（byn3_backup_pro_*.json）</div>
    <div>ここにドラッグ＆ドロップ、または</div>
    <label for="bynFileInput">ファイルを選ぶ</label>
    <input type="file" id="bynFileInput" accept=".json,application/json">
    <div class="files" id="bynFileStatus">未読込</div>
  </div>

  <div class="drop" id="noteDrop">
    <div><b>② 万車ノート</b>（mansha-note*.json）</div>
    <div>ここにドラッグ＆ドロップ、または</div>
    <label for="noteFileInput">ファイルを選ぶ</label>
    <input type="file" id="noteFileInput" accept=".json,application/json">
    <div class="files" id="noteFileStatus">未読込</div>
  </div>
  <div class="sub">2つは別々に読み込めます。片方だけでも集計します。間違った枠に入れても自動で振り分けます。</div>

  <section id="bynSection" class="hidden">
    <h2>📊 BYN3 サイト別実績 <button id="bynClear" style="float:right;padding:6px 12px;border-radius:8px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;cursor:pointer">このデータだけ消す</button></h2>
    <div class="grid" id="bynSummary"></div>
    <div class="scroll"><table id="bynTable"></table></div>
    <h2>🤝 重なりの分解（排他）</h2>
    <div class="scroll"><table id="bynOverlap"></table></div>
    <h2>🚗 車立て別</h2>
    <div class="scroll"><table id="bynCars"></table></div>
  </section>

  <section id="noteSection" class="hidden">
    <h2>🌋 万車ノート集計 <button id="noteClear" style="float:right;padding:6px 12px;border-radius:8px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;cursor:pointer">このデータだけ消す</button></h2>
    <div class="grid" id="noteSummary"></div>
    <h2>🔢 万車券の車番パターン</h2>
    <div id="notePatterns"></div>
    <h2>📜 万車券リスト</h2>
    <div class="scroll"><table id="noteList"></table></div>
  </section>
</div>

<script>
const state = { byn: null, note: null };
const yen = n => Math.round(n).toLocaleString() + '円';
const pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '—';

function detectAndLoad(data, name) {
  if (Array.isArray(data) && data.length && data[0].sites) {
    state.byn = data; renderByn();
    document.getElementById('bynFileStatus').textContent = `読込済: ${name}（${data.length}件）`;
  } else if (data && Array.isArray(data.races)) {
    state.note = data.races; renderNote();
    document.getElementById('noteFileStatus').textContent = `読込済: ${name}（${data.races.length}件）`;
  } else { alert('形式を判別できませんでした: ' + name); }
}

function handleFiles(files) {
  [...files].forEach(f => {
    const r = new FileReader();
    r.onload = e => { try { detectAndLoad(JSON.parse(e.target.result), f.name); } catch (err) { alert('読み込み失敗: ' + f.name); } };
    r.readAsText(f);
  });
}
function wireDrop(zoneId, inputId) {
  const zone = document.getElementById(zoneId);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); handleFiles(e.dataTransfer.files); });
  document.getElementById(inputId).addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
}
wireDrop('bynDrop', 'bynFileInput');
wireDrop('noteDrop', 'noteFileInput');
document.getElementById('bynClear').addEventListener('click', () => {
  state.byn = null;
  document.getElementById('bynSection').classList.add('hidden');
  document.getElementById('bynFileStatus').textContent = '未読込';
});
document.getElementById('noteClear').addEventListener('click', () => {
  state.note = null;
  document.getElementById('noteSection').classList.add('hidden');
  document.getElementById('noteFileStatus').textContent = '未読込';
});

/* ---------- BYN3 ---------- */
function p3(r) { const v = parseInt(String(r.payout3).replace(/,/g, ''), 10); return isNaN(v) ? 0 : v; }

function renderByn() {
  const d = state.byn;
  document.getElementById('bynSection').classList.remove('hidden');
  const tot = d.length;
  const mans = d.filter(r => p3(r) >= 10000);
  document.getElementById('bynSummary').innerHTML =
    `<div class="card">記録レース<div class="big">${tot}R</div></div>
     <div class="card">万車券<div class="big">${mans.length}R</div></div>
     <div class="card">全体の万車券率<div class="big cyan">${pct(mans.length, tot)}</div></div>`;
  const sites = ['B', 'Y', 'N'];
  const rows = sites.map(s => {
    const bets = d.filter(r => r.sites[s].bet);
    const hit = bets.filter(r => p3(r) >= 10000);
    const g5 = bets.filter(r => p3(r) >= 5000);
    const cap = mans.length ? hit.length / mans.length : 0;
    const avg = hit.length ? hit.reduce((a, r) => a + p3(r), 0) / hit.length : 0;
    return { s, n: bets.length, hit: hit.length, rate: bets.length ? hit.length / bets.length : 0, g5: bets.length ? g5.length / bets.length : 0, cap, avg };
  });
  const maxAvg = Math.max(...rows.map(r => r.avg), 1);
  rows.forEach(r => { r.idx = Math.round(r.rate * 100 * 0.35 + r.g5 * 100 * 0.25 + r.cap * 100 * 0.25 + (r.avg / maxAvg * 100) * 0.15); });
  document.getElementById('bynTable').innerHTML =
    '<tr><th>サイト</th><th>予想</th><th>万車</th><th>的中率</th><th>5千以上</th><th>捕捉率</th><th>的中時平均</th><th>指数</th></tr>' +
    rows.map(r => `<tr><td><b>${r.s}</b></td><td>${r.n}R</td><td>${r.hit}R</td><td>${(r.rate * 100).toFixed(1)}%</td><td>${(r.g5 * 100).toFixed(1)}%</td><td>${(r.cap * 100).toFixed(1)}%</td><td>${r.avg ? yen(r.avg) : '—'}</td><td>${r.idx}</td></tr>`).join('');
  // 排他分解
  const combos = [
    ['Bのみ', r => r.sites.B.bet && !r.sites.Y.bet && !r.sites.N.bet],
    ['Yのみ', r => !r.sites.B.bet && r.sites.Y.bet && !r.sites.N.bet],
    ['Nのみ', r => !r.sites.B.bet && !r.sites.Y.bet && r.sites.N.bet],
    ['B+Y', r => r.sites.B.bet && r.sites.Y.bet && !r.sites.N.bet],
    ['B+N', r => r.sites.B.bet && !r.sites.Y.bet && r.sites.N.bet],
    ['Y+N', r => !r.sites.B.bet && r.sites.Y.bet && r.sites.N.bet],
    ['B+Y+N', r => r.sites.B.bet && r.sites.Y.bet && r.sites.N.bet],
    ['どこも予想なし', r => !r.sites.B.bet && !r.sites.Y.bet && !r.sites.N.bet],
  ];
  document.getElementById('bynOverlap').innerHTML =
    '<tr><th>組合せ</th><th>レース数</th><th>万車券率</th><th>平均3連単</th></tr>' +
    combos.map(([label, f]) => {
      const sel = d.filter(f); if (!sel.length) return '';
      const m = sel.filter(r => p3(r) >= 10000).length;
      const avg = sel.reduce((a, r) => a + p3(r), 0) / sel.length;
      return `<tr><td>${label}</td><td>${sel.length}R</td><td>${pct(m, sel.length)}</td><td>${yen(avg)}</td></tr>`;
    }).join('');
  // 車立て別
  const byCar = {};
  d.forEach(r => { const k = r.racers || '?'; (byCar[k] = byCar[k] || []).push(r); });
  document.getElementById('bynCars').innerHTML =
    '<tr><th>車立て</th><th>レース数</th><th>万車券率</th></tr>' +
    Object.keys(byCar).sort().map(k => {
      const sel = byCar[k]; const m = sel.filter(r => p3(r) >= 10000).length;
      return `<tr><td>${k}車</td><td>${sel.length}R</td><td>${pct(m, sel.length)}</td></tr>`;
    }).join('');
}

/* ---------- mansha-note ---------- */
function renderNote() {
  const rs = state.note;
  document.getElementById('noteSection').classList.remove('hidden');
  const dates = rs.map(r => r.date).filter(Boolean).sort();
  const mans = rs.filter(r => (r.sanrentan || 0) >= 10000);
  document.getElementById('noteSummary').innerHTML =
    `<div class="card">記録レース<div class="big">${rs.length}R</div><div class="muted">${dates[0] || ''} 〜 ${dates[dates.length - 1] || ''}</div></div>
     <div class="card">万車券<div class="big">${mans.length}R</div></div>
     <div class="card">万車券率<div class="big cyan">${pct(mans.length, rs.length)}</div></div>
     <div class="card">万車券の平均配当<div class="big amber">${mans.length ? yen(mans.reduce((a, r) => a + r.sanrentan, 0) / mans.length) : '—'}</div></div>`;
  // 車番パターン（万車券のみ）
  const cnt = (arr) => { const m = {}; arr.forEach(x => m[x] = (m[x] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const firsts = cnt(mans.map(r => r.first.car)), seconds = cnt(mans.map(r => r.second.car)), thirds = cnt(mans.map(r => r.third.car));
  const combos = cnt(mans.map(r => `${r.first.car}-${r.second.car}-${r.third.car}`)).slice(0, 10);
  const inner = mans.map(r => [r.first.car, r.second.car, r.third.car].filter(c => c <= 3).length);
  const innerDist = [0, 1, 2, 3].map(k => `${k}人: ${pct(inner.filter(x => x === k).length, mans.length)}`).join(' / ');
  const sumDist = cnt(mans.map(r => r.first.car + r.second.car + r.third.car)).slice(0, 5);
  document.getElementById('notePatterns').innerHTML =
    `<div class="card"><b>1着の車番</b>：${firsts.map(([c, n]) => `${c}番 ${n}回（${pct(n, mans.length)}）`).join('、')}</div>
     <div class="card"><b>2着の車番</b>：${seconds.map(([c, n]) => `${c}番 ${n}回（${pct(n, mans.length)}）`).join('、')}</div>
     <div class="card"><b>3着の車番</b>：${thirds.map(([c, n]) => `${c}番 ${n}回（${pct(n, mans.length)}）`).join('、')}</div>
     <div class="card"><b>出目トップ10</b><ul class="list">${combos.map(([c, n]) => `<li>${c} … ${n}回</li>`).join('')}</ul></div>
     <div class="card"><b>内枠（1〜3番車）が3着内に何人</b>：${innerDist}</div>
     <div class="card"><b>車番合計の多い帯</b>：${sumDist.map(([c, n]) => `合計${c} … ${n}回`).join('、')}</div>`;
  // リスト（会場は記録が当てにならないので使わない）
  document.getElementById('noteList').innerHTML =
    '<tr><th>日付</th><th>R</th><th>級</th><th>着順</th><th>3連単</th></tr>' +
    mans.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).map(r =>
      `<tr><td>${r.date || ''}</td><td>${r.raceNo}R</td><td>${r.klass || ''}</td><td>${r.first.car}-${r.second.car}-${r.third.car}</td><td>${yen(r.sanrentan)}</td></tr>`).join('');
}
</script>
</body>
</html>
