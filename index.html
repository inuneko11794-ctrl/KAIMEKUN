<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>バトルバンク君 - BYN Race Analyzer</title>
  
  <!-- Tailwind CSS (CDN版) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (CDN版) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (JSXをブラウザでそのまま動かすための翻訳機) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  
  <!-- アプリの表示領域 -->
  <div id="root"></div>

  <!-- ここから下がアプリの全プログラム -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── データインポート用モーダル ───
    const DataImportModal = ({ isOpen, onClose, onImportSuccess }) => {
      const [fileName, setFileName] = useState(null);

      if (!isOpen) return null;

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setFileName(file.name);
        const reader = new FileReader();

        reader.onload = (event) => {
          try {
            const jsonData = JSON.parse(event.target.result);
            onImportSuccess(jsonData);
            alert(`${file.name} の読み込みに成功しました！`);
            setFileName(null);
            onClose();
          } catch (error) {
            console.error("JSONエラー:", error);
            alert("JSONファイルの解析に失敗しました。");
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-700 bg-slate-800/50">
              <h2 className="font-bold text-slate-100 text-sm">システム・アップデート</h2>
              <button onClick={() => { setFileName(null); onClose(); }} className="text-slate-400 font-bold text-base px-2">✕</button>
            </div>
            <div className="p-5">
              <p className="text-xs text-slate-300 mb-4 leading-relaxed">
                過去の予想ノート（<code className="bg-slate-900 px-1 py-0.5 rounded text-emerald-400 border border-slate-700">.json</code>）を選択して、バトルバンク君に学習させます。
              </p>
              <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-600 border-dashed rounded-xl cursor-pointer bg-slate-900/50 hover:bg-slate-900 transition">
                <div className="flex flex-col items-center justify-center pt-4 pb-5 px-4 text-center">
                  <span className="text-2xl mb-1">📁</span>
                  <p className="text-xs font-semibold text-slate-200">クリックしてファイルを選択</p>
                  <p className="text-[10px] text-slate-400 mt-1">mansha-note や byn3_backup</p>
                </div>
                <input type="file" className="hidden" accept=".json" onChange={handleFileUpload} />
              </label>
              {fileName && (
                <div className="mt-3 p-2 bg-emerald-950/80 border border-emerald-800/60 rounded-lg text-xs text-emerald-300 font-medium truncate">
                  選択中: {fileName}
                </div>
              )}
            </div>
            <div className="flex items-center justify-end px-5 py-3 bg-slate-800/50 border-t border-slate-700">
              <button onClick={() => { setFileName(null); onClose(); }} className="px-4 py-2 bg-slate-700 border border-slate-600 text-slate-200 font-bold text-xs rounded-lg">キャンセル</button>
            </div>
          </div>
        </div>
      );
    };

    // ─── メインアプリ ───
    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [races, setRaces] = useState([]);
      const [isImportModalOpen, setIsImportModalOpen] = useState(false);

      // ローカル保存データ読込
      useEffect(() => {
        const saved = localStorage.getItem('byn_races_data');
        if (saved) {
          try {
            setRaces(JSON.parse(saved));
          } catch (e) {
            console.error(e);
          }
        }
      }, []);

      const saveToStorage = (newData) => {
        setRaces(newData);
        localStorage.setItem('byn_races_data', JSON.stringify(newData));
      };

      const handleImportSuccess = (jsonData) => {
        const dataArray = Array.isArray(jsonData) ? jsonData : (jsonData.races || [jsonData]);
        saveToStorage(dataArray);
      };

      const handleExportJson = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(races, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `byn_backup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* ヘッダー */}
          <header className="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-md">
            <div className="flex items-center gap-2">
              <span className="text-xl">🚲</span>
              <h1 className="font-extrabold text-base sm:text-lg tracking-wider bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                バトルバンク君
              </h1>
            </div>
            <button onClick={() => setIsImportModalOpen(true)} className="px-3 py-1.5 bg-slate-700 text-white font-bold text-xs rounded-lg shadow flex items-center gap-1 border border-slate-600">
              <span>⚙️</span>
              <span>データ読込</span>
            </button>
          </header>

          {/* メインエリア */}
          <main className="flex-1 p-4 max-w-4xl w-full mx-auto pb-20">
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 shadow-lg">
                  <h2 className="text-sm font-bold text-slate-300 mb-2">🎯 レースデータサマリー</h2>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    現在の登録レース数: <span className="text-emerald-400 font-bold text-base">{races.length}</span> 件
                  </p>
                  <div className="mt-4">
                    <button onClick={handleExportJson} className="px-3 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow">
                      バックアップ保存 (JSON)
                    </button>
                  </div>
                </div>
                <div className="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 shadow-lg">
                  <h3 className="text-xs font-bold text-slate-400 mb-2">💡 クイックガイド</h3>
                  <p className="text-xs text-slate-300">
                    右上から「データ読込」を開き、保存済みのJSONファイルをインポートしてください。
                  </p>
                </div>
              </div>
            )}
            
            {activeTab === 'input' && (
              <div className="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 shadow-lg">
                <h2 className="text-sm font-bold text-slate-300 mb-3">📝 レース手動登録・OCR</h2>
                <p className="text-xs text-slate-400">スクショ解析や手動入力エリア。</p>
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 shadow-lg">
                <h2 className="text-sm font-bold text-slate-300 mb-3">🎯 統計分析</h2>
                <p className="text-xs text-slate-400">三分戦・7車立ての配当傾向など。</p>
              </div>
            )}

            {activeTab === 'settings' && (
              <div className="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 shadow-lg space-y-4">
                <h2 className="text-sm font-bold text-slate-300 mb-2">⚙️ システム管理</h2>
                <button onClick={() => { if (confirm("全データを消去しますか？")) saveToStorage([]); }} className="px-3 py-2 bg-rose-600 text-white text-xs font-bold rounded-lg shadow">
                  全データリセット
                </button>
              </div>
            )}
          </main>

          {/* インポートモーダル呼び出し */}
          <DataImportModal isOpen={isImportModalOpen} onClose={() => setIsImportModalOpen(false)} onImportSuccess={handleImportSuccess} />

          {/* ボトムナビゲーション */}
          <nav className="bg-slate-800 border-t border-slate-700 fixed bottom-0 left-0 right-0 z-40 shadow-lg pb-safe">
            <div className="max-w-4xl mx-auto flex justify-around py-2">
              <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center text-xs font-bold transition ${activeTab === 'dashboard' ? 'text-emerald-400' : 'text-slate-400'}`}>
                <span className="text-lg">🎯</span><span>メイン</span>
              </button>
              <button onClick={() => setActiveTab('input')} className={`flex flex-col items-center text-xs font-bold transition ${activeTab === 'input' ? 'text-emerald-400' : 'text-slate-400'}`}>
                <span className="text-lg">📝</span><span>入力</span>
              </button>
              <button onClick={() => setActiveTab('analytics')} className={`flex flex-col items-center text-xs font-bold transition ${activeTab === 'analytics' ? 'text-emerald-400' : 'text-slate-400'}`}>
                <span className="text-lg">🎯</span><span>分析</span>
              </button>
              <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center text-xs font-bold transition ${activeTab === 'settings' ? 'text-emerald-400' : 'text-slate-400'}`}>
                <span className="text-lg">⚙️</span><span>設定</span>
              </button>
            </div>
          </nav>
        </div>
      );
    };

    // Reactを起動
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
