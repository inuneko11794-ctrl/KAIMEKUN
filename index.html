<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バトルバンク君 - 予想＆結果ストックツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // JSONデータの保持
      const [siteData, setSiteData] = useState({ mansha: null, byn: null });
      
      // ストックされた予想リスト
      const [predictions, setPredictions] = useState([]);

      // 予想作成用のフォーム状態
      const [form, setForm] = useState({
        raceNo: '1',
        line: '7-5-2/4-3/1-6',
        marks: '◎◯△/☓✖/☆★'
      });

      // 初回ロード時にローカルストレージから復元
      useEffect(() => {
        const savedData = localStorage.getItem('battlebank_data');
        if (savedData) setSiteData(JSON.parse(savedData));

        const savedPreds = localStorage.getItem('battlebank_predictions');
        if (savedPreds) setPredictions(JSON.parse(savedPreds));
      }, []);

      // データの保存
      const handleFileUpload = (e, type) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const json = JSON.parse(event.target.result);
            const newData = { ...siteData, [type]: json };
            setSiteData(newData);
            localStorage.setItem('battlebank_data', JSON.stringify(newData));
            alert(`${type}のデータをサイトに保存しました！`);
          } catch (err) {
            alert('ファイルの読み込みに失敗しました。');
          }
        };
        reader.readAsText(file);
      };

      // 展開と印から買い目を自動生成するロジック
      const generatePicks = (lineStr, markStr) => {
        // 数字のみ抽出 (例: ['7','5','2','4','3','1','6'])
        const nums = lineStr.match(/\d/g) || [];
        // / やスペースを除いた印を抽出 (例: ['◎','◯','△','☓','✖','☆','★'])
        const markChars = markStr.replace(/[\/\s]/g, '').split('');

        // 印と車番を紐付け
        const markMap = {};
        markChars.forEach((m, i) => {
          if (nums[i]) markMap[m] = nums[i];
        });

        const getNum = (m) => markMap[m] || 'X';

        // 買い目のパターン（好みに合わせて変更可能）
        const tansho = [getNum('◎'), getNum('◯')];
        
        const nirentan = [
          `${getNum('◎')}-${getNum('◯')}`,
          `${getNum('◎')}-${getNum('△')}`,
          `${getNum('◯')}-${getNum('◎')}`,
          `${getNum('◯')}-${getNum('△')}`,
          `${getNum('◎')}-${getNum('☓')}`
        ];

        const sanrentan = [
          `${getNum('◎')}-${getNum('◯')}-${getNum('△')}`,
          `${getNum('◎')}-${getNum('◯')}-${getNum('☓')}`,
          `${getNum('◎')}-${getNum('△')}-${getNum('◯')}`,
          `${getNum('◯')}-${getNum('◎')}-${getNum('△')}`,
          `${getNum('◯')}-${getNum('◎')}-${getNum('☓')}`
        ];

        return { tansho, nirentan, sanrentan };
      };

      // 予想をストックする
      const handleAddPrediction = () => {
        const picks = generatePicks(form.line, form.marks);
        const newPred = {
          id: Date.now().toString(),
          raceNo: form.raceNo,
          line: form.line,
          marks: form.marks,
          picks: picks,
          result: { first: '', second: '', third: '', payout: '' },
          isFinished: false
        };

        const updated = [newPred, ...predictions];
        setPredictions(updated);
        localStorage.setItem('battlebank_predictions', JSON.stringify(updated));
      };

      // 結果を追記して保存する
      const handleUpdateResult = (id, field, value) => {
        const updated = predictions.map(p => {
          if (p.id === id) {
            return { ...p, result: { ...p.result, [field]: value } };
          }
          return p;
        });
        setPredictions(updated);
      };

      const handleFinishRace = (id) => {
        const updated = predictions.map(p => {
          if (p.id === id) return { ...p, isFinished: true };
          return p;
        });
        setPredictions(updated);
        localStorage.setItem('battlebank_predictions', JSON.stringify(updated));
      };

      const handleDelete = (id) => {
        const updated = predictions.filter(p => p.id !== id);
        setPredictions(updated);
        localStorage.setItem('battlebank_predictions', JSON.stringify(updated));
      };

      // データのクリア
      const clearAllData = () => {
        if (confirm('すべてのデータとストックした予想を削除しますか？')) {
          localStorage.clear();
          setSiteData({ mansha: null, byn: null });
          setPredictions([]);
        }
      };

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6">
          <div className="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 className="text-2xl font-bold text-emerald-400">バトルバンク君 - 予想ストック</h1>
            <button onClick={clearAllData} className="text-xs bg-red-900 hover:bg-red-800 text-red-200 px-3 py-1 rounded">
              全データリセット
            </button>
          </div>

          {/* ステップ1: ファイル読み込み */}
          <div className="bg-gray-800 p-4 rounded-lg mb-6 shadow-md border border-gray-700">
            <h2 className="text-sm text-gray-400 mb-3">1. ベースデータの読み込み（サイト内に保持されます）</h2>
            <div className="flex gap-4">
              <div className="flex-1">
                <label className="text-xs mb-1 block text-gray-500">mansha-note (.json)</label>
                <input type="file" accept=".json" onChange={(e) => handleFileUpload(e, 'mansha')} className="text-sm w-full" />
                {siteData.mansha && <span className="text-xs text-emerald-400">✓ 保持済み</span>}
              </div>
              <div className="flex-1">
                <label className="text-xs mb-1 block text-gray-500">byn3_backup (.json)</label>
                <input type="file" accept=".json" onChange={(e) => handleFileUpload(e, 'byn')} className="text-sm w-full" />
                {siteData.byn && <span className="text-xs text-emerald-400">✓ 保持済み</span>}
              </div>
            </div>
          </div>

          {/* ステップ2: 展開と印を入力して予想を作成 */}
          <div className="bg-gray-800 p-5 rounded-lg mb-8 shadow-md border border-emerald-900">
            <h2 className="text-lg font-bold text-emerald-400 mb-4">2. 展開・印を入力して買い目を生成</h2>
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
              <div>
                <label className="text-xs text-gray-400 block mb-1">レース番号</label>
                <input type="number" value={form.raceNo} onChange={e => setForm({...form, raceNo: e.target.value})} className="bg-gray-900 border border-gray-600 rounded px-3 py-2 w-full text-white" />
              </div>
              <div className="md:col-span-2">
                <label className="text-xs text-gray-400 block mb-1">展開（例: 7-5-2/4-3/1-6/）</label>
                <input type="text" value={form.line} onChange={e => setForm({...form, line: e.target.value})} className="bg-gray-900 border border-gray-600 rounded px-3 py-2 w-full font-mono text-emerald-300" />
              </div>
              <div>
                <label className="text-xs text-gray-400 block mb-1">印（例: ◎◯△/☓✖/☆★）</label>
                <input type="text" value={form.marks} onChange={e => setForm({...form, marks: e.target.value})} className="bg-gray-900 border border-gray-600 rounded px-3 py-2 w-full font-mono text-yellow-300" />
              </div>
            </div>
            <button onClick={handleAddPrediction} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2 rounded shadow w-full md:w-auto">
              予想をストックする
            </button>
          </div>

          {/* ステップ3: 予想のストック一覧と結果入力 */}
          <h2 className="text-xl font-bold text-blue-400 mb-4">3. ストックされたレース（結果入力待ち）</h2>
          
          <div className="space-y-6">
            {predictions.map(pred => (
              <div key={pred.id} className={`p-4 rounded-lg border ${pred.isFinished ? 'bg-gray-900 border-gray-700 opacity-80' : 'bg-gray-800 border-blue-800 shadow-lg'}`}>
                
                {/* ヘッダー部分 */}
                <div className="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                  <div className="flex items-center gap-3">
                    <span className="text-xl font-bold text-white bg-gray-700 px-3 py-1 rounded">第{pred.raceNo}R</span>
                    <span className="font-mono text-gray-300 text-sm">{pred.line}</span>
                    <span className="font-mono text-yellow-400 text-sm">{pred.marks}</span>
                  </div>
                  <button onClick={() => handleDelete(pred.id)} className="text-gray-500 hover:text-red-400 text-sm">削除</button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* 自動生成された買い目表示エリア */}
                  <div>
                    <h3 className="text-xs text-gray-400 mb-2">生成された買い目</h3>
                    <div className="bg-gray-900 p-3 rounded space-y-2 font-mono text-sm">
                      <div className="flex gap-2">
                        <span className="text-gray-500 w-12">単勝:</span>
                        <span className="text-emerald-400">{pred.picks.tansho.join(', ')}</span>
                      </div>
                      <div className="flex gap-2">
                        <span className="text-gray-500 w-12">2連単:</span>
                        <span className="text-blue-300">{pred.picks.nirentan.join(', ')}</span>
                      </div>
                      <div className="flex gap-2">
                        <span className="text-gray-500 w-12">3連単:</span>
                        <span className="text-pink-300">{pred.picks.sanrentan.join(', ')}</span>
                      </div>
                    </div>
                  </div>

                  {/* 後から追記する結果入力エリア */}
                  <div>
                    <h3 className="text-xs text-gray-400 mb-2">レース結果（後書き用）</h3>
                    {!pred.isFinished ? (
                      <div className="space-y-3">
                        <div className="flex gap-2">
                          <input type="number" placeholder="1着" value={pred.result.first} onChange={e => handleUpdateResult(pred.id, 'first', e.target.value)} className="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-16 text-center text-white" />
                          <span className="text-gray-500 self-center">-</span>
                          <input type="number" placeholder="2着" value={pred.result.second} onChange={e => handleUpdateResult(pred.id, 'second', e.target.value)} className="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-16 text-center text-white" />
                          <span className="text-gray-500 self-center">-</span>
                          <input type="number" placeholder="3着" value={pred.result.third} onChange={e => handleUpdateResult(pred.id, 'third', e.target.value)} className="bg-gray-900 border border-gray-600 rounded px-2 py-1 w-16 text-center text-white" />
                        </div>
                        <div className="flex gap-3">
                          <input type="text" placeholder="配当 (例: 1540)" value={pred.result.payout} onChange={e => handleUpdateResult(pred.id, 'payout', e.target.value)} className="bg-gray-900 border border-gray-600 rounded px-3 py-1 flex-1 text-white" />
                          <button onClick={() => handleFinishRace(pred.id)} className="bg-blue-600 hover:bg-blue-500 px-4 py-1 rounded text-white text-sm">
                            結果を確定
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="bg-gray-800 p-3 border border-gray-600 rounded flex items-center justify-between">
                        <div className="font-mono text-lg font-bold text-white">
                          {pred.result.first}-{pred.result.second}-{pred.result.third}
                        </div>
                        <div className="text-yellow-400 font-bold">
                          ¥{pred.result.payout}
                        </div>
                      </div>
                    )}
                  </div>
                </div>

              </div>
            ))}
            
            {predictions.length === 0 && (
              <p className="text-gray-500 text-center py-10 border border-dashed border-gray-700 rounded-lg">
                まだストックされたレースがありません。「予想をストックする」ボタンから追加してください。
              </p>
            )}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
